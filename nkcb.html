        }
        .nav-btn:active {

            cursor: not-allowed;
            transform: none;
            box-shadow: none;

    const periodLabels = {1: "第一节", 2: "第二节", 3: "第三节", 4: "第四节", 5: "第五节"};
    const periodTimes = {1: "1-2节", 2: "3-4节", 3: "5-6节", 4: "7-8节", 5: "9-10节"};
    const timeOfDay = {1: "上午", 2: "上午", 3: "下午", 4: "下午", 5: "晚上"};

    const courseColorMap = {
        "操作系统": "#4E79A7",
        "Python课程设计": "#F28E2B",
        "计算机网络": "#59A14F",
        "大学生创业基础": "#E15759",
        "Python程序设计": "#76B7B2",
        "书法鉴赏": "#B07AA1",
        "编译原理": "#EDC948",
        "形势与政策": "#9C755F",
        "算法设计与分析": "#5B9BD5",
        "微机原理与接口技术": "#E07B39",
    };

    function getCourseColor(name) {
        for (var key in courseColorMap) {
            if (name.indexOf(key) !== -1) return courseColorMap[key];
        }
        return "#4E79A7";
    }

    function addDays(dateStr, days) {
        var parts = dateStr.split('-');
        var d = new Date(parts[0], parts[1] - 1, parseInt(parts[2]) + days);
        var month = d.getMonth() + 1;
        var day = d.getDate();
        return month + "月" + day + "日";
    }

    function formatDate(dateStr) {
        // Handle both date strings and Date objects
        var d;
        if (typeof dateStr === 'string') {
            // Parse YYYY-MM-DD manually to avoid timezone issues
            var parts = dateStr.split('-');
            d = new Date(parts[0], parts[1] - 1, parts[2]);
        } else {
            d = dateStr;
        }
        var month = d.getMonth() + 1;
        var day = d.getDate();
        return month + "月" + day + "日";
    }

    function updateSchedule() {
        var weekNum = parseInt(document.getElementById('weekSelect').value);
        var weekRange = weekRanges[weekNum - 1];

        // Update week info
        var weekInfo = document.getElementById('weekInfo');
        weekInfo.innerHTML = '<strong>第' + weekNum + '周</strong>  (' + weekRange.start_cn + ' - ' + weekRange.end_cn + ')&emsp;|&emsp;' +
            '周一：' + formatDate(weekRange.start) + '&emsp;周二：' + addDays(weekRange.start, 1) +
            '&emsp;周三：' + addDays(weekRange.start, 2) +
            '&emsp;周四：' + addDays(weekRange.start, 3) +
            '&emsp;周五：' + addDays(weekRange.start, 4) +
            '&emsp;周六：' + addDays(weekRange.start, 5) +
            '&emsp;周日：' + addDays(weekRange.start, 6);

        // Build table
        var tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = '';

        for (var period = 1; period <= 5; period++) {
            var row = document.createElement('tr');

            // Period label cell
            var periodCell = document.createElement('td');
            periodCell.innerHTML = '<span class="period-label">' + timeOfDay[period] + '</span>' +
                '<span class="period-time">' + periodLabels[period] + '<br>' + periodTimes[period] + '</span>';
            row.appendChild(periodCell);

            // Day cells
            for (var day = 0; day < 7; day++) {
                var cell = document.createElement('td');
                var courses = scheduleData[String(period)][String(day)];

                // Filter courses for this week
                var activeCourses = [];
                if (courses) {
                    for (var i = 0; i < courses.length; i++) {
                        if (courses[i].weeks.indexOf(weekNum) !== -1) {
                            activeCourses.push(courses[i]);
                        }
                    }
                }

                if (activeCourses.length === 0) {
                    cell.innerHTML = '<span class="no-course">无课程</span>';
                } else {
                    var html = '';
                    for (var j = 0; j < activeCourses.length; j++) {
                        var c = activeCourses[j];
                        var color = getCourseColor(c.name);
                        html += '<div class="course-card" style="border-left-color: ' + color + ';">';
                        html += '<div class="course-name">' + c.name + '</div>';
                        html += '<div class="course-detail">';
                        if (c.room) html += '<span>' + c.room + '</span>';
                        if (c.teacher) html += '<span>' + c.teacher + '</span>';
                        html += '</div>';
                        html += '</div>';
                    }
                    cell.innerHTML = html;
                }

                // Weekend styling
                if (day >= 5) {
                    cell.classList.add('weekend-cell');
                }

                row.appendChild(cell);
            }

            tbody.appendChild(row);
        }
    }

    // Initialize
    updateSchedule();
    

    // Navigation functions
    function goToPrevWeek() {
        var weekSelect = document.getElementById('weekSelect');
        var currentWeek = parseInt(weekSelect.value);
        if (currentWeek > 1) {
            weekSelect.value = currentWeek - 1;
            updateSchedule();
            updateNavButtons();
        }
    }

    function goToNextWeek() {
        var weekSelect = document.getElementById('weekSelect');
        var currentWeek = parseInt(weekSelect.value);
        if (currentWeek < 16) {
            weekSelect.value = currentWeek + 1;
            updateSchedule();
            updateNavButtons();
        }
    }

    function updateNavButtons() {
        var weekSelect = document.getElementById('weekSelect');
        var currentWeek = parseInt(weekSelect.value);
        var prevBtn = document.getElementById('prevBtn');
        var nextBtn = document.getElementById('nextBtn');

        prevBtn.disabled = currentWeek <= 1;
        nextBtn.disabled = currentWeek >= 16;
    }

    // Initialize navigation buttons
    updateNavButtons();
    </script>
